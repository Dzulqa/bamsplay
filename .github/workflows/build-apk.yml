name: Build Bamsplay Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.*'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses & Install Android 36 Platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || echo "Proceeding with tracked Android assets and configurations"

      - name: Fix Linux Line Endings & Permissions for Gradle
        run: |
          sed -i 's/\r$//' ./android/gradlew
          chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle_build.log 2>&1 || {
            echo "### ❌ Gradle Build Failure" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 ../gradle_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat ../gradle_build.log | grep -A 20 "FAILURE:" || tail -n 50 ../gradle_build.log
            exit 1
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle_build.log

      - name: Commit and Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log-branch
          cp gradle_build.log build-error.txt || echo "No log found" > build-error.txt
          git add build-error.txt
          git commit -m "chore: save gradle build error log" || true
          git push -f origin build-log-branch || true

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Bamsplay-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bamsplay-Android-APK
          path: release-output/Bamsplay-v1.0.apk
          retention-days: 30
