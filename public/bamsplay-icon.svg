<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer glow filter -->
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.2  0 0 0 0 1  0 0 0 1 0" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Inner dark radial for depth -->
    <radialGradient id="bgGrad" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#5500cc" />
      <stop offset="55%" stop-color="#4400aa" />
      <stop offset="100%" stop-color="#2d0080" />
    </radialGradient>

    <!-- Glossy highlight overlay -->
    <radialGradient id="glossGrad" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#aa55ff" />
      <stop offset="100%" stop-color="#7722dd" />
    </linearGradient>

    <!-- B letter gradient: white top → soft pink-lavender bottom -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dda8ff" />
    </linearGradient>

    <!-- Shadow under whole icon -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#6600cc" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- ===== OUTER GLOW RING (blurred bigger circle) ===== -->
  <circle cx="256" cy="256" r="230" fill="#8833ff" opacity="0.35" filter="url(#outerGlow)" />

  <!-- ===== MAIN ICON GROUP with drop shadow ===== -->
  <g filter="url(#dropShadow)">

    <!-- Border ring -->
    <circle cx="256" cy="256" r="210" fill="url(#ringGrad)" />

    <!-- Inner dark circle (main background) -->
    <circle cx="256" cy="256" r="192" fill="url(#bgGrad)" />

    <!-- Glossy sheen on top -->
    <circle cx="256" cy="256" r="192" fill="url(#glossGrad)" />

    <!-- ===== LETTER B + PLAY GLYPH ===== -->
    <!--
      The glyph is a stylized "B" where:
      - Left vertical stem = tall rectangle
      - Upper bump = standard B upper half
      - Lower bump = morphs into a play-arrow triangle pointing right
    -->
    <g transform="translate(256,256)">
      <!--
        Path breakdown (centered at 0,0):
        - Start top-left of stem
        - Tall left stem going down
        - Upper-right bump (standard B arc)
        - Mid horizontal
        - Lower bump curves out into play triangle tip
      -->
      <path
        d="
          M -68,-108
          L -68, 108
          C -68, 116, -60, 120, -52, 116
          L  62,  18
          C  70,  13,  70,   3,  62,  -2
          L -20, -52

          M -68,-108
          C -68,-116, -58,-120, -50,-116
          L  38, -68
          C  52, -60,  52, -42,  38, -34
          L -20, -8
        "
        fill="none"
        stroke="url(#letterGrad)"
        stroke-width="52"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>
</svg>
