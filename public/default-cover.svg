<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b0f38" />
      <stop offset="50%" stop-color="#0f0722" />
      <stop offset="100%" stop-color="#070312" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="vinylShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg)" />

  <!-- Ambient Glow -->
  <circle cx="300" cy="300" r="260" fill="url(#glow)" />

  <!-- Vinyl Disc Outer Ring -->
  <circle cx="300" cy="300" r="230" fill="#120924" stroke="#3b1f69" stroke-width="3" />
  
  <!-- Vinyl Grooves -->
  <circle cx="300" cy="300" r="210" fill="none" stroke="#251347" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6" />
  <circle cx="300" cy="300" r="190" fill="none" stroke="#251347" stroke-width="1.5" opacity="0.5" />
  <circle cx="300" cy="300" r="170" fill="none" stroke="#251347" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.6" />
  <circle cx="300" cy="300" r="150" fill="none" stroke="#251347" stroke-width="1.5" opacity="0.4" />
  <circle cx="300" cy="300" r="130" fill="none" stroke="#251347" stroke-width="1.5" opacity="0.5" />

  <!-- Vinyl Sheen Highlight -->
  <path d="M 120 120 L 480 480" stroke="url(#vinylShine)" stroke-width="90" stroke-linecap="round" opacity="0.4" />

  <!-- Center Label Outer -->
  <circle cx="300" cy="300" r="95" fill="url(#bg)" stroke="url(#accent)" stroke-width="3" />

  <!-- Center Equalizer Visualizer Bars -->
  <g transform="translate(300, 300)">
    <rect x="-42" y="-20" width="8" height="40" rx="4" fill="url(#accent)" opacity="0.75" />
    <rect x="-26" y="-38" width="8" height="76" rx="4" fill="url(#accent)" opacity="0.9" />
    <rect x="-10" y="-55" width="8" height="110" rx="4" fill="url(#accent)" />
    <rect x="6" y="-44" width="8" height="88" rx="4" fill="url(#accent)" opacity="0.95" />
    <rect x="22" y="-30" width="8" height="60" rx="4" fill="url(#accent)" opacity="0.8" />
    <rect x="38" y="-16" width="8" height="32" rx="4" fill="url(#accent)" opacity="0.65" />
    
    <!-- Spindle Hole -->
    <circle cx="0" cy="0" r="10" fill="#070312" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Bamsplay Audio Brandmark Badge -->
  <text x="300" y="540" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#c084fc" letter-spacing="4" opacity="0.8">BAMSPLAY AUDIO</text>
</svg>
